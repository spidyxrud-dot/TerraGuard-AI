services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terraguard
      POSTGRES_USER: terraguard
      POSTGRES_PASSWORD: terraguard
    ports:
      - "5432:5432"
    volumes:
      - terraguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraguard -d terraguard"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  terraguard-postgres:
